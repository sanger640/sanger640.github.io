<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Sensitivity Analysis of a Trained Pendulum Policy</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#6b6b6b">Sparse-reward swing-up, SAC / PPO</text>

  <g fill="#eef2fa" stroke="#3a5a8f" stroke-width="1.5">
    <rect x="40" y="110" width="190" height="60" rx="8"/>
  </g>
  <text x="135" y="135" text-anchor="middle" font-size="13.5" fill="#1a1a1a">Nominal initial state</text>
  <text x="135" y="153" text-anchor="middle" font-size="13.5" fill="#1a1a1a">(&#952;&#8320;, &#952;&#775;&#8320;)</text>

  <g fill="#f5eefa" stroke="#6b3a8f" stroke-width="1.5">
    <rect x="40" y="220" width="190" height="60" rx="8"/>
  </g>
  <text x="135" y="245" text-anchor="middle" font-size="13.5" fill="#1a1a1a">Gaussian-perturbed</text>
  <text x="135" y="263" text-anchor="middle" font-size="13.5" fill="#1a1a1a">initial states (&#215;N)</text>

  <g fill="#eef5ee" stroke="#3a6b3a" stroke-width="1.5">
    <rect x="300" y="165" width="180" height="60" rx="8"/>
  </g>
  <text x="390" y="190" text-anchor="middle" font-size="13.5" fill="#1a1a1a">Trained SAC / PPO</text>
  <text x="390" y="208" text-anchor="middle" font-size="13.5" fill="#1a1a1a">policy rollout</text>

  <g fill="#fbf3ea" stroke="#8a5a1a" stroke-width="1.5">
    <rect x="560" y="165" width="200" height="60" rx="8"/>
  </g>
  <text x="660" y="190" text-anchor="middle" font-size="13.5" fill="#1a1a1a">Phase-space divergence</text>
  <text x="660" y="208" text-anchor="middle" font-size="13.5" fill="#1a1a1a">nominal vs. perturbed</text>

  <g stroke="#9a9a9a" stroke-width="1.5" fill="none" marker-end="url(#arrow4)">
    <path d="M230 140 L300 185"/>
    <path d="M230 250 L300 205"/>
    <path d="M480 195 L560 195"/>
  </g>

  <text x="400" y="330" text-anchor="middle" font-size="13" fill="#8a8a8a">Small divergence far from a failure boundary &#8226; large divergence near one</text>
  <text x="400" y="352" text-anchor="middle" font-size="12.5" fill="#8a8a8a">the same perturb-and-compare idea later scaled up in Latent Safety Filters</text>

  <defs>
    <marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9a9a9a"/>
    </marker>
  </defs>
</svg>
